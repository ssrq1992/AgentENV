<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1180" viewBox="0 0 1480 1180">
<rect width="1480" height="1180" fill="#0f1822"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#c4d0dc">
<text x="32" y="48" font-size="28">AgentENV × SSF · 生命周期与数据屏障</text>
<text x="32" y="83" font-size="18">蓝：原生模块 / 公共框架　棕：运行时定制与厂商 Driver　绿：持久存储 / 数据边界</text>
<rect x="24" y="112" width="1432" height="240" rx="8" fill="#111c27" stroke="#64798d"/>
<text x="44" y="146" font-size="23">创建 / 提交</text>
<rect x="44" y="164" width="1392" height="46" rx="6" fill="#24364a" stroke="#64798d"/>
<text x="60" y="194" font-size="20">原 Gateway → 原 Scheduler：计算预留 + 卷解析 / 绑定</text>
<rect x="44" y="220" width="1392" height="46" rx="6" fill="#24364a" stroke="#64798d"/>
<text x="60" y="250" font-size="20">共享 Coordinator Attach → 完整签名计划 → Prepare</text>
<rect x="44" y="276" width="1392" height="46" rx="6" fill="#44392c" stroke="#64798d"/>
<text x="60" y="306" font-size="20">原 Orchestrator spawn → guest 设备验证 → 可信 Ready / Commit</text>
<rect x="24" y="372" width="1432" height="240" rx="8" fill="#111c27" stroke="#64798d"/>
<text x="44" y="406" font-size="23">暂停 / 恢复</text>
<rect x="44" y="424" width="1392" height="46" rx="6" fill="#24364a" stroke="#64798d"/>
<text x="60" y="454" font-size="20">冻结与原生暂停；UseHold 保留逻辑使用权</text>
<rect x="44" y="480" width="1392" height="46" rx="6" fill="#44392c" stroke="#64798d"/>
<text x="60" y="510" font-size="20">真实 stop → 释放本 run 资源；新 run 原子接续 epoch</text>
<rect x="44" y="536" width="1392" height="46" rx="6" fill="#24364a" stroke="#64798d"/>
<text x="60" y="566" font-size="20">保留原 ID、自动暂停 / connect 恢复与驱逐策略</text>
<rect x="24" y="632" width="1432" height="240" rx="8" fill="#111c27" stroke="#64798d"/>
<text x="44" y="666" font-size="23">快照 / Fork / 模板</text>
<rect x="44" y="684" width="1392" height="46" rx="6" fill="#44392c" stroke="#64798d"/>
<text x="60" y="714" font-size="20">native memory・rootfs + legacy + CSI 同屏障捕获</text>
<rect x="44" y="740" width="1392" height="46" rx="6" fill="#24364a" stroke="#64798d"/>
<text x="60" y="770" font-size="20">CheckpointSet / Snapshot・Content UID / 仓库 pin 联合发布</text>
<rect x="44" y="796" width="1392" height="46" rx="6" fill="#253a33" stroke="#64798d"/>
<text x="60" y="826" font-size="20">RW 独立克隆；RO 按语义共享；替换隐藏旧盘并保留 FD</text>
<rect x="24" y="892" width="1432" height="240" rx="8" fill="#111c27" stroke="#64798d"/>
<text x="44" y="926" font-size="23">删除 / 恢复 / 回收</text>
<rect x="44" y="944" width="1392" height="46" rx="6" fill="#44392c" stroke="#64798d"/>
<text x="60" y="974" font-size="20">持久清理 outbox → 原 VMM 停止重试与真实证据</text>
<rect x="44" y="1000" width="1392" height="46" rx="6" fill="#24364a" stroke="#64798d"/>
<text x="60" y="1030" font-size="20">Unpublish → 最后引用 Unstage → Detach；未知结果不强删</text>
<rect x="44" y="1056" width="1392" height="46" rx="6" fill="#253a33" stroke="#64798d"/>
<text x="60" y="1086" font-size="20">用户卷保留；内部克隆 / capture 仅在所有引用消失后回收</text>
</g></svg>
