# Drop-in for the existing agentenv.service. Preserve its original ExecStart.
[Unit]
After=agentenv-storage-node.service
Wants=agentenv-storage-node.service

[Service]
Environment=AENV_NODE_ID=agentenv-host
Environment=AENV_STORAGE_PROVIDER_ENABLED=true
Environment=AENV_STORAGE_PROVIDER_READONLY_SLOTS=1
Environment=AENV_STORAGE_PROVIDER_STANDALONE=true
Environment=AENV_STORAGE_PROVIDER_URL=http://127.0.0.1:9445
Environment=AENV_STORAGE_PROVIDER_TOKEN_FILE=/etc/agentenv-storage/hook-token
