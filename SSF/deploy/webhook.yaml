# Render CA_BUNDLE before applying; install only after Guard is ready.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata: {name: ssf-guard}
webhooks:
  - name: storage.ssf.dev
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 5
    clientConfig:
      service: {namespace: ssf-system, name: ssf-guard, path: /validate, port: 443}
      caBundle: CA_BUNDLE
    rules:
      - operations: [CREATE, UPDATE, DELETE]
        apiGroups: ['']
        apiVersions: [v1]
        resources: [persistentvolumeclaims, persistentvolumes]
        scope: '*'
      - operations: [CREATE, UPDATE]
        apiGroups: ['']
        apiVersions: [v1]
        resources: [pods]
        scope: Namespaced
      - operations: [CREATE, UPDATE, DELETE]
        apiGroups: [snapshot.storage.k8s.io]
        apiVersions: [v1]
        resources: [volumesnapshots, volumesnapshotcontents]
        scope: '*'
